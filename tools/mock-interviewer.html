<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Interviewer</title>
<style>
  :root { --bg:#f3f5f6; --surface:#fff; --ink:#17222b; --muted:#5d6b76; --line:#d9e0e5; --accent:#0d6e74; --accent-ink:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f161b; --surface:#17212a; --ink:#e6edf1; --muted:#93a3ae; --line:#2a3843; --accent:#4fb3b9; --accent-ink:#06272a; color-scheme: dark; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:680px; margin:0 auto; padding:28px 16px 48px; display:flex; flex-direction:column; gap:16px; }
  h1 { font:500 28px Georgia,serif; margin:0; }
  p { margin:0; color:var(--muted); }
  textarea { width:100%; box-sizing:border-box; min-height:160px; padding:14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:18px/1.5 Georgia,serif; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button { font:500 15px system-ui,sans-serif; border-radius:8px; padding:10px 18px; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--ink); }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  select, input[type=range] { max-width:100%; accent-color:var(--accent); }
  select { padding:8px; border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink); }
  label { font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:6px; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>Mock Interviewer</h1>
  <p>Paste what the interviewer says, then press Play. Uses your browser's built-in voices; nothing leaves your computer.</p>
  <textarea id="text" aria-label="Interviewer line">Acme Pay is our checkout product for online merchants. Last quarter, gross profit fell about 20%, even though the value of transactions we processed grew about 20%. Why, and what should we do?</textarea>
  <div class="row">
    <button class="primary" id="play" type="button">Play</button>
    <button id="stop" type="button">Stop</button>
  </div>
  <div class="row">
    <label>Voice <select id="voice"></select></label>
    <label>Speed <input id="rate" type="range" min="0.8" max="1.2" step="0.05" value="1"></label>
  </div>
  <p id="msg" hidden>This browser can't read text aloud. Try Chrome or Safari.</p>
</main>
<script>
  const synth = window.speechSynthesis; let voices = [];
  function fill() {
    if (!synth) return;
    voices = synth.getVoices().filter(v => /^en/i.test(v.lang));
    const sel = document.getElementById("voice"); sel.innerHTML = "";
    const pick = voices.find(v => /en-GB/i.test(v.lang)) || voices[0];
    voices.forEach(v => { const o = document.createElement("option"); o.value = v.name; o.textContent = v.name + " (" + v.lang + ")"; if (pick && v.name === pick.name) o.selected = true; sel.appendChild(o); });
  }
  if (!synth) { document.getElementById("msg").hidden = false; }
  else { fill(); synth.onvoiceschanged = fill; }
  document.getElementById("play").onclick = () => {
    if (!synth) return; synth.cancel();
    const u = new SpeechSynthesisUtterance(document.getElementById("text").value);
    const v = voices.find(x => x.name === document.getElementById("voice").value); if (v) u.voice = v;
    u.rate = parseFloat(document.getElementById("rate").value) || 1; synth.speak(u);
  };
  document.getElementById("stop").onclick = () => synth && synth.cancel();
</script>
</body>
</html>
